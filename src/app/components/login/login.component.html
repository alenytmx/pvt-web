<div class="login-container d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card login-card shadow-lg p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">Iniciar sesión</h3>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label for="user" class="form-label">Usuario</label>
        <input
          type="text"
          id="user"
          class="form-control"
          formControlName="user"
          placeholder="Ingresa tu usuario"
        />
        <div class="text-danger small" *ngIf="loginForm.get('user')?.touched && loginForm.get('user')?.invalid">
          <span *ngIf="loginForm.get('user')?.errors?.['required']">El usuario es requerido.</span>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <input
            [type]="mostrarPassword ? 'text' : 'password'"
            id="password"
            class="form-control"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
          />
          <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()">
            <i class="bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <div class="text-danger small" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es requerida.</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Debe tener al menos 8 caracteres.</span>
        </div>
      </div>

      <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
          Ingresar
        </button>
      </div>
    </form>

    <div class="text-center mt-3 small text-muted">
      PVT Beta
    </div>
  </div>
</div>
